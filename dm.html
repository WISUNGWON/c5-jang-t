<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>메시지 · Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=33" />
</head>
<body class="dm-body">
  <aside class="side-nav" aria-label="메인 메뉴">
    <a class="logo" href="index.html" aria-label="Instagram">
      <img src="assets/instagram-logo.png" alt="" width="24" height="24" />
    </a>

    <nav class="nav-icons">
      <a href="index.html" class="nav-item" aria-label="홈"><img src="assets/icons/home.svg" alt="" width="24" height="24" /></a>
      <a href="#" class="nav-item" aria-label="릴스"><img src="assets/icons/reels.svg" alt="" width="24" height="24" /></a>
      <a href="dm.html" class="nav-item is-active" aria-label="메시지" aria-current="page"><img src="assets/icons/message.svg" alt="" width="24" height="24" /></a>
      <a href="#" class="nav-item" aria-label="검색"><img src="assets/icons/search.svg" alt="" width="24" height="24" /></a>
      <a href="#" class="nav-item" aria-label="알림"><img src="assets/icons/heart.svg" alt="" width="24" height="24" /></a>
      <a href="#" class="nav-item" aria-label="만들기"><img src="assets/icons/create.svg" alt="" width="24" height="24" /></a>
    </nav>
  </aside>

  <aside class="dm-list" aria-label="대화 목록">
    <header class="dm-list-head">
      <h1 class="dm-user">jangphotogood</h1>
      <button class="dm-icon-btn" aria-label="새 메시지">
        <img src="assets/icons/new-message.svg" alt="" width="24" height="24" />
      </button>
    </header>

    <h2 class="dm-section-title">메시지</h2>

    <ul class="dm-conversations">
      <li>
        <button class="dm-conv" type="button" id="conv-mina" data-conv="mina">
          <span class="dm-avatar" aria-hidden="true">
            <svg viewBox="0 0 56 56">
              <circle cx="28" cy="28" r="28" fill="#dbdbdb"/>
              <circle cx="28" cy="22" r="10" fill="#ffffff"/>
              <path d="M8 52c0-11 9-18 20-18s20 7 20 18" fill="#ffffff"/>
            </svg>
          </span>
          <span class="dm-conv-name">김솔</span>
        </button>
      </li>
    </ul>
  </aside>

  <main class="dm-empty" id="dm-empty" aria-label="내 메시지">
    <div class="dm-empty-ring" aria-hidden="true">
      <img src="assets/icons/message-48.svg" alt="" width="48" height="48" />
    </div>
    <h2 class="dm-empty-title">내 메시지</h2>
    <p class="dm-empty-sub">친구나 그룹에 비공개 사진과 메시지를 보내보세요</p>
    <button class="dm-send-btn" type="button">메시지 보내기</button>
  </main>

  <!-- Chat conversation view (hidden until a conversation is picked) -->
  <section class="chat" id="chat" hidden aria-label="김솔과의 대화">
    <header class="chat-header">
      <button class="chat-back" type="button" aria-label="목록으로">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="dm-avatar dm-avatar--md" aria-hidden="true">
        <svg viewBox="0 0 44 44">
          <circle cx="22" cy="22" r="22" fill="#dbdbdb"/>
          <circle cx="22" cy="17" r="8" fill="#ffffff"/>
          <path d="M6 40c0-9 7-14 16-14s16 5 16 14" fill="#ffffff"/>
        </svg>
      </span>
      <div class="chat-peer">
        <div class="chat-peer-name">김솔</div>
        <div class="chat-peer-handle">kimsol_slamme</div>
      </div>
      <div class="chat-actions">
        <button class="dm-icon-btn" aria-label="음성 통화">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-3 2a12 12 0 0 0 5 5l2-3 5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 6a2 2 0 0 1 2-2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button class="dm-icon-btn" aria-label="영상 통화">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="7" width="13" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="m16 10 5-3v10l-5-3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="dm-icon-btn" aria-label="대화 정보">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <circle cx="12" cy="8" r="1" fill="currentColor"/>
            <path d="M12 11v6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="chat-body">
      <div class="chat-date">2027년 1월 3일 오후 11:20</div>

      <div class="msg msg--in"><span class="bubble">안녕하세요, 모델 김솔이에요!
연락드려요, 제 사진을 예쁘게 찍어주셔서.</span></div>

      <div class="msg msg--out"><span class="bubble">안녕하세요! 별 말씀을요.
모델이 좋으니 당연한 결과물이지요 ^^</span></div>

      <div class="msg msg--in"><span class="bubble">감사해요.
진짜 모델로 거듭난 것 같아요, 덕분에.
그래서 말인데, 해주실 수 있나요?
제 전담 포토그래퍼!</span></div>

      <div class="msg msg--out"><span class="bubble">저야 영광이죠^^~</span></div>
    </div>

    <form class="chat-input" onsubmit="return false">
      <button type="button" class="chat-input-btn" aria-label="이모티콘">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="9" cy="10.5" r="1.1" fill="currentColor"/>
          <circle cx="15" cy="10.5" r="1.1" fill="currentColor"/>
          <path d="M8.5 15c1 1.2 2.1 1.8 3.5 1.8s2.5-.6 3.5-1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <input type="text" placeholder="메시지 입력..." aria-label="메시지 입력" />
      <button type="button" class="chat-input-btn" aria-label="음성 메시지">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="3" width="6" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="chat-input-btn" aria-label="사진 보내기">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="8" cy="10" r="1.6" fill="currentColor"/>
          <path d="m4 18 5-6 4 4 3-3 4 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" class="chat-input-btn" aria-label="좋아요 보내기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.35-7-10a4.5 4.5 0 0 1 7-3.72A4.5 4.5 0 0 1 19 10c0 5.65-7 10-7 10Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </section>

  <script>
    (function () {
      const conv = document.getElementById('conv-mina');
      const empty = document.getElementById('dm-empty');
      const chat = document.getElementById('chat');
      const back = chat.querySelector('.chat-back');

      function openChat() {
        conv.classList.add('is-selected');
        empty.hidden = true;
        chat.hidden = false;
        document.body.classList.add('chat-open');
      }
      function closeChat() {
        conv.classList.remove('is-selected');
        empty.hidden = false;
        chat.hidden = true;
        document.body.classList.remove('chat-open');
      }

      conv.addEventListener('click', openChat);
      back.addEventListener('click', closeChat);
    })();
  </script>
</body>
</html>
