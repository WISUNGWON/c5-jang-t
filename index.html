<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>@jangphotogood · Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="style.css?v=29" />
</head>
<body>
  <aside class="side-nav" aria-label="메인 메뉴">
    <a class="logo" href="#" aria-label="Instagram">
      <img src="assets/instagram-logo.png" alt="" width="24" height="24" />
    </a>

    <nav class="nav-icons">
      <a href="#" class="nav-item" aria-label="홈"><img src="assets/icons/home.svg" alt="" width="24" height="24" /></a>
      <a href="#" class="nav-item" aria-label="릴스"><img src="assets/icons/reels.svg" alt="" width="24" height="24" /></a>
      <a href="dm.html" class="nav-item" aria-label="메시지"><img src="assets/icons/message.svg" alt="" width="24" height="24" /></a>
      <a href="#" class="nav-item" aria-label="검색"><img src="assets/icons/search.svg" alt="" width="24" height="24" /></a>
      <a href="#" class="nav-item" aria-label="알림"><img src="assets/icons/heart.svg" alt="" width="24" height="24" /></a>
      <a href="#" class="nav-item" aria-label="만들기"><img src="assets/icons/create.svg" alt="" width="24" height="24" /></a>
    </nav>
  </aside>

  <main class="content">
    <header class="profile">
      <div class="avatar" aria-hidden="true">
        <svg class="avatar-person" viewBox="0 0 100 100">
          <circle cx="50" cy="38" r="18" fill="currentColor"/>
          <path d="M18 92c0-20 14-32 32-32s32 12 32 32" fill="currentColor"/>
        </svg>
      </div>
      <div class="profile-info">
        <div class="profile-head">
          <h1 class="username">@jangphotogood</h1>
          <button class="more-btn" aria-label="더 보기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5.5" cy="12" r="1.7" fill="currentColor"/>
              <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
              <circle cx="18.5" cy="12" r="1.7" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <p class="name">안패션</p>
        <ul class="stats">
          <li>게시물 <b>6</b></li>
          <li>팔로워 <b>2.7만</b></li>
          <li>팔로잉 <b>1</b></li>
        </ul>
      </div>
    </header>

    <div class="actions">
      <button class="pill-btn">프로필 편집</button>
      <button class="pill-btn">보관함 보기</button>
    </div>

    <nav class="tabs" aria-label="프로필 탭">
      <button class="tab is-active" aria-label="게시물">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2.8" y="2.8" width="4.4" height="4.4" fill="currentColor"/>
          <rect x="9.8" y="2.8" width="4.4" height="4.4" fill="currentColor"/>
          <rect x="16.8" y="2.8" width="4.4" height="4.4" fill="currentColor"/>
          <rect x="2.8" y="9.8" width="4.4" height="4.4" fill="currentColor"/>
          <rect x="9.8" y="9.8" width="4.4" height="4.4" fill="currentColor"/>
          <rect x="16.8" y="9.8" width="4.4" height="4.4" fill="currentColor"/>
          <rect x="2.8" y="16.8" width="4.4" height="4.4" fill="currentColor"/>
          <rect x="9.8" y="16.8" width="4.4" height="4.4" fill="currentColor"/>
          <rect x="16.8" y="16.8" width="4.4" height="4.4" fill="currentColor"/>
        </svg>
        <span class="tab-indicator" aria-hidden="true"></span>
      </button>
      <button class="tab" aria-label="릴스">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 9v6l5-3-5-3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
        <span class="tab-indicator" aria-hidden="true"></span>
      </button>
      <button class="tab" aria-label="리포스트">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 8h11M15 5l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17 16H6M9 19l-3-3 3-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="tab-indicator" aria-hidden="true"></span>
      </button>
      <button class="tab" aria-label="태그됨">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="3.5" width="17" height="17.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="10.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M7 19.5c1.2-2.4 3-3.6 5-3.6s3.8 1.2 5 3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <span class="tab-indicator" aria-hidden="true"></span>
      </button>
    </nav>

    <section class="grid" id="post-grid" aria-label="게시물 그리드"></section>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal" hidden aria-hidden="true">
    <div class="modal-overlay" data-close></div>

    <button class="modal-close" data-close aria-label="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <button class="post-nav post-nav--prev" id="prev-post" aria-label="이전 게시물">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="modal-dialog" role="dialog" aria-modal="true" aria-label="게시물">
      <div class="media" id="media">
        <div class="media-track" id="media-track"></div>

        <button class="media-nav media-nav--prev" id="prev-photo" aria-label="이전 사진">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="media-nav media-nav--next" id="next-photo" aria-label="다음 사진">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

        <button class="tagged-toggle" aria-label="태그된 사람 보기">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="11" fill="#000"/>
            <circle cx="12" cy="10.2" r="3" fill="#fff"/>
            <path d="M6.5 18.5c1.2-2.4 3-3.5 5.5-3.5s4.3 1.1 5.5 3.5" fill="#fff"/>
          </svg>
        </button>

        <div class="tag-bubbles" id="tag-bubbles" aria-hidden="true"></div>

        <div class="dots" id="dots" aria-hidden="true"></div>
      </div>

      <aside class="side-panel">
        <header class="side-header">
          <div class="avatar avatar--sm" aria-hidden="true"></div>
          <div class="side-user">jangphotogood</div>
          <button class="side-more" aria-label="더 보기">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="5.5" cy="12" r="1.7" fill="currentColor"/>
              <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
              <circle cx="18.5" cy="12" r="1.7" fill="currentColor"/>
            </svg>
          </button>
        </header>

        <div class="side-body">
          <div class="caption">
            <div class="avatar avatar--sm" aria-hidden="true"></div>
            <div class="caption-text" id="caption-text"></div>
          </div>
          <ul class="comments" id="comments"></ul>
        </div>

        <div class="side-actions">
          <button class="action-btn" aria-label="좋아요">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.35-7-10a4.5 4.5 0 0 1 7-3.72A4.5 4.5 0 0 1 19 10c0 5.65-7 10-7 10Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span class="action-count" id="count-likes"></span>
          </button>
          <button class="action-btn" aria-label="댓글">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12c0-4.97 4.03-8.5 9-8.5s9 3.53 9 8.5-4.03 8.5-9 8.5c-1.29 0-2.52-.24-3.64-.68L3 21l1.4-4.17A8.1 8.1 0 0 1 3 12Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
            <span class="action-count" id="count-comments"></span>
          </button>
          <button class="action-btn" aria-label="공유">
            <img src="assets/icons/message.svg" alt="" width="24" height="24" />
            <span class="action-count" id="count-shares"></span>
          </button>
        </div>

        <div class="likes" id="likes"></div>
        <div class="date" id="date"></div>

        <form class="comment-form" onsubmit="return false">
          <button type="button" class="emoji-btn" aria-label="이모티콘">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="9" cy="10.5" r="1.1" fill="currentColor"/>
              <circle cx="15" cy="10.5" r="1.1" fill="currentColor"/>
              <path d="M8.5 15c1 1.2 2.1 1.8 3.5 1.8s2.5-.6 3.5-1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
          <input type="text" placeholder="댓글 달기..." aria-label="댓글 달기" />
          <button type="submit" class="post-btn">게시</button>
        </form>
      </aside>
    </div>

    <button class="post-nav post-nav--next" id="next-post" aria-label="다음 게시물">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <script src="app.js?v=22"></script>
</body>
</html>
